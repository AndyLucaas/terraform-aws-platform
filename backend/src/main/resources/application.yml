spring:
  application:
    name: it-ticketing-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_schema: itdesk

  flyway:
    enabled: true
    schemas: itdesk
    default-schema: itdesk
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Clé de signature HMAC-SHA256 : 32 caractères minimum, jamais commitée.
    # Changer cette valeur invalide instantanément tous les tokens émis.
    secret: ${JWT_SECRET}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:900}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}
  storage:
    attachments-path: ${ATTACHMENTS_PATH}
    max-file-size-bytes: 10485760

logging:
  level:
    root: INFO
    com.itdesk.platform: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
