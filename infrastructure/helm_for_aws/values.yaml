# Configuration globale partagée entre l'umbrella chart et les subcharts
global:
  name: "aws-secrets-manager"
  namespace: "production"
  service: SecretsManager
  region: eu-north-1


frontend:
  replicaCount: 1
  namespace: "production"
  image:
    repository: andylucas06/itdesk-frontend
    pullPolicy: IfNotPresent
    tag: 2

  ports:
    - name: http-port
      containerPort: 8080
      protocol: TCP

  service:
    - port: 8080
      targetPort: http-port
      protocol: TCP
  
  externalSecret:
    enabled: true
    name: front-credentials
    refreshInterval: 1h

    secretStoreRef:
      name: aws-secrets-manager
      kind: SecretStore

    target:
      name: database-credentials
      creationPolicy: Owner

    data:
      - secretKey: JWT_TOKEN
        remoteRef:
          key: prod/secret/database
          property: JWT_TOKEN

backend:
  replicaCount: 1
  namespace: "production"
  image:
    repository: andylucas06/itdesk-backend
    pullPolicy: IfNotPresent
    tag: 1
  
  ports:
    - name:  http-port
      containerPort: 8080
      protocol: TCP
  service:
    - port: 8080
      targetPort: http-port
      protocol: TCP

  externalSecret:
    enabled: true
    name: database-credentials
    refreshInterval: 1h

    secretStoreRef:
      name: aws-secrets-manager
      kind: SecretStore

    target:
      name: database-credentials
      creationPolicy: Owner

    data:
      - secretKey: DB_USERNAME
        remoteRef:
          key: prod/secret/database
          property: DB_USERNAME

      - secretKey: DB_PASSWORD
        remoteRef:
          key: prod/secret/database
          property: DB_USERNAME
      - secretKey: JWT_SECRET
        remoteRef:
          key: prod/secret/database
          property: JWT_SECRET
      - secretKey: JWT_ACCESS_TOKEN_VALIDITY_SECONDS
        remoteRef:
          key: prod/secret/database
          property: JWT_ACCESS_TOKEN_VALIDITY_SECONDS
      - secretKey: JWT_REFRESH_TOKEN_VALIDITY_SECONDS
        remoteRef:
          key: prod/secret/database
          property: JWT_REFRESH_TOKEN_VALIDITY_SECONDS

  config:
    SERVER_PORT: "8080"
    CORS_ALLOWED_ORIGINS: "http://app.itticket.local"
    ATTACHMENTS_PATH: "/var/itdesk/attachments"
    DB_URL: "jdbc:postgresql://itticket-postgresql-svc:5432/itdesk"
    DB_NAME: "itdesk"
  volumes:
    - name: attachments
      emptyDir: {}
  volumeMounts:
    - name: attachments
      mountPath: /var/itdesk/attachments

ingress:
  enabled: true
  namespace: "production"
  className: alb
  annotations: 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: app.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-frontend-svc
              port:
                number: 8080
    - host: api.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-backend-svc
              port:
                number: 8080
  # tls: 
  #   - secretName: chart-example-tls
  #     hosts:  
  #       - app.itticket.local
autoscaling:
  enabled: false
httpRoute:
  enabled: false 

resources:
  enabled: false
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

volumes: []

volumeMounts: []