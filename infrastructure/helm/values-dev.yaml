frontend:
  replicaCount: 1
  image:
    repository: andylucas06/itdesk-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  ports:
    - name: http-port-frontend
      containerPort: 80
      protocol: TCP

  service:
    port: 8080
    targetPort: http-port-frontend
    protocol: TCP
  ingress:
    enabled: false
    tls: []

backend:
  replicaCount: 1
  image:
    repository: andylucas06/itdesk-backend
    pullPolicy: IfNotPresent
    tag: "14"
  ports:
    - name:  http-port
      containerPort: 8080
      protocol: TCP
  service:
    type: ClusterIP
    port: 8080
    targetPort: http-port
  config:
    enabled: "true"
    DB_URL: jdbc:postgresql://itticket-postgres:5432/itdesk
    KEYCLOAK_ISSUER_URI: http://auth.itticket.local/realms/itdesk
    KEYCLOAK_JWK_URI: http://itticket-keycloak:8080/realms/itdesk/protocol/openid-connect/certs
    KEYCLOAK_REALM: itdesk
    KEYCLOAK_CLIENT_ID: itdesk-backend
    KEYCLOAK_ADMIN_BASE_URL: http://itticket-keycloak:8080
    KEYCLOAK_ADMIN_CLIENT_ID: itdesk-admin-cli
    KEYCLOAK_TOKEN_URI: http://itticket-keycloak:8080/realms/itdesk/protocol/openid-connect/token
    SERVER_PORT: "8080"
    CORS_ALLOWED_ORIGINS: http://app.itticket.local
    ATTACHMENTS_PATH: /var/itdesk/attachments

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: app.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-frontend-svc
              port:
                number: 8080
    - host: api.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-backend-svc
              port:
                number: 8080
    - host: auth.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-keycloak
              port:
                number: 8080