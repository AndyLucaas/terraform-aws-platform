image:
  repository: andylucas06/itdesk-backend
  pullPolicy: IfNotPresent
  tag: ""

labels:
  app: itdesk-backend

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

config:
  DB_URL: jdbc:postgresql://postgres-service:5432/itdesk
  KEYCLOAK_ISSUER_URI: https://auth.itdesk.example.com/realms/itdesk
  KEYCLOAK_JWK_URI: http://keycloak-service:8080/realms/itdesk/protocol/openid-connect/certs
  KEYCLOAK_REALM: itdesk
  KEYCLOAK_CLIENT_ID: itdesk-backend
  KEYCLOAK_ADMIN_BASE_URL: http://keycloak-service:8080
  KEYCLOAK_ADMIN_CLIENT_ID: itdesk-admin-cli
  KEYCLOAK_TOKEN_URI: http://keycloak-service:8080/realms/itdesk/protocol/openid-connect/token
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: https://itdesk.example.com
  ATTACHMENTS_PATH: /var/itdesk/attachments  
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

