image:
  repository: andylucas06/itdesk-backend
  pullPolicy: IfNotPresent
  tag: ""

labels:
  app: itdesk-backend

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

config: {}

ingress:
  enabled: false

externalSecret:
  enabled: false


resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 250Mi
  # requests:
  #   cpu: 250m
  #   memory: 125Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior: {}

volumes: []

volumeMounts: []

postgres:
  enabled: true
  image: {}
  service: {}
  persistence: {}