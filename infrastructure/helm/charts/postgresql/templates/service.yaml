apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.fullname" . }}-svc
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- with .Values.service }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  selector:
    {{- include "postgresql.selectorLabels" . | nindent 4 }}
