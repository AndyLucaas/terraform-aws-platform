# Configuration globale partagée entre l'umbrella chart et les subcharts
global:
  name: "aws-secrets-manager"
  namespace: "production"
  service: SecretsManager
  region: eu-north-1


frontend:
  replicaCount: 1
  namespace: "production"
  image:
    repository: andylucas06/itdesk-frontend
    pullPolicy: IfNotPresent
    tag: 2

  ports:
    - name: http-port
      containerPort: 8080
      protocol: TCP

  service:
    - port: 8080
      targetPort: http-port
      protocol: TCP
  
  externalSecret:
    enabled: true
    name: front-credentials
    refreshInterval: 1h

    secretStoreRef:
      name: aws-secrets-manager
      kind: SecretStore

    target:
      name: database-credentials
      creationPolicy: Owner

    data:
      - secretKey: JWT_TOKEN
        remoteRef:
          key: prod/secret/database
          property: JWT_TOKEN

backend:
  replicaCount: 1
  namespace: "production"
  image:
    repository: andylucas06/itdesk-backend
    pullPolicy: IfNotPresent
    tag: 21
  
  ports:
    - name:  http-port
      containerPort: 8080
      protocol: TCP
  service:
    - port: 8080
      targetPort: http-port
      protocol: TCP

  externalSecret:
    enabled: true
    name: database-credentials
    refreshInterval: 1h

    secretStoreRef:
      name: aws-secrets-manager
      kind: SecretStore

    target:
      name: database-credentials
      creationPolicy: Owner

    data:
      - secretKey: DB_USERNAME
        remoteRef:
          key: prod/secret/database
          property: DB_USERNAME

      - secretKey: DB_PASSWORD
        remoteRef:
          key: prod/secret/database
          property: DB_PASSWORD

      - secretKey: JWT_SECRET
        remoteRef:
          key: prod/secret/database
          property: JWT_SECRET
      - secretKey: JWT_ACCESS_TOKEN_VALIDITY_SECONDS
        remoteRef:
          key: prod/secret/database
          property: JWT_ACCESS_TOKEN_VALIDITY_SECONDS
      - secretKey: JWT_REFRESH_TOKEN_VALIDITY_SECONDS
        remoteRef:
          key: prod/secret/database
          property: JWT_REFRESH_TOKEN_VALIDITY_SECONDS

  config:
    SERVER_PORT: "8080"
    CORS_ALLOWED_ORIGINS: "http://app.itticket.local"
    ATTACHMENTS_PATH: "/var/itdesk/attachments"
    DB_URL: "jdbc:postgresql://itticket-postgresql-svc:5432/itdesk"
    DB_NAME: "itdesk"
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 20
        policies:
          - type: Percent
            value: 80
            periodSeconds: 15
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 80
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
        selectPolicy: Max

  volumes:
    - name: attachments
      emptyDir: {}
  volumeMounts:
    - name: attachments
      mountPath: /var/itdesk/attachments

ingress:
  enabled: true
  namespace: "production"
  className: alb
  annotations: 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: app.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-frontend-svc
              port:
                number: 8080
    - host: api.itticket.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: itticket-backend-svc
              port:
                number: 8080

