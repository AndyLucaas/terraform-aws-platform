frontend:
  replicaCount: 1
  image:
    repository: andylucas06/itdesk-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    tls: []

backend:
  replicaCount: 1
  image:
    repository: andylucas06/itdesk-backend
    pullPolicy: IfNotPresent
    tag: ""
  service: {}
  config: {}
    
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: 
    - secretName: chart-example-tls
      hosts:
        - chart-example.local
autoscaling:
  enabled: false
httpRoute:
  enabled: false 
service:
    type: ClusterIP
    port: 8080
resources:
  enabled: false
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

volumes: []

volumeMounts: []