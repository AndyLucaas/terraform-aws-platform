# NOTE — le frontend n'a AUCUNE variable d'environnement ici. Comme on l'a vu
# en construisant le Dockerfile, les VITE_* sont figées dans le bundle JS au
# moment du `docker build --build-arg ...`, pas relues à l'exécution du
# conteneur Nginx. Pour changer VITE_API_BASE_URL,
# il faut rebuild et repousser une nouvelle image — un ConfigMap ne peut rien
# y changer une fois l'image construite.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: itdesk
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: REGISTRY/it-ticketing-platform-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            # false car Nginx écrit dans /var/cache/nginx et /var/run à
            # l'exécution ; passer à true nécessiterait de monter ces chemins
            # en emptyDir en plus.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
