apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: itdesk
data:
  # Nom de service interne — le backend et Postgres sont dans le même namespace.
  DB_URL: jdbc:postgresql://postgres:5432/itdesk

  SERVER_PORT: "8080"

  # Origine du frontend telle qu'exposée publiquement.
  CORS_ALLOWED_ORIGINS: https://itdesk.example.com

  ATTACHMENTS_PATH: /var/itdesk/attachments

  # Durées de vie des jetons : 15 min pour l'access token, 7 jours pour le refresh.
  JWT_ACCESS_TOKEN_VALIDITY_SECONDS: "900"
  JWT_REFRESH_TOKEN_VALIDITY_SECONDS: "604800"
