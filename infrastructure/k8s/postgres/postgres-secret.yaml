# Source unique des identifiants PostgreSQL. Le Deployment postgres ET le
# Deployment backend lisent tous les deux ce Secret — jamais deux copies
# séparées, pour éviter tout risque de désynchronisation entre les deux.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: itdesk
type: Opaque
stringData:
  POSTGRES_USER: itdesk
  POSTGRES_PASSWORD: CHANGEME_remplacez_par_un_vrai_mot_de_passe
