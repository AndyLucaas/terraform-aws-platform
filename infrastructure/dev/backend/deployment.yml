apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: rollingUpdate
    rollingUpdate:
      maxSurge: 1               # Combien de Pods en plus pendant l'update
      maxUnavailable: 0          # Combien de Pods peuvent être indisponibles
    progressDeadlineSeconds: 600  # Timeout pour détecter un rollout bloqué
    minReadySeconds: 10           # Attendre 10s après Ready avant de continuer
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: andylucas06/itdesk-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env: #conf via db secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          envFrom: # conf via backend configmap and secret
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret 
