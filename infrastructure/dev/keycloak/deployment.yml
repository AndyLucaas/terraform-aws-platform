apiVersion: v1
kind: deployment
metadata:
  name: keycloak-deployment
  namespace: dev
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak-container
          image: quay.io/keycloak/keycloak:24.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
          envFrom: #secret
            - secretRef:
                name: kc-secret
          volumeMounts:
                - name: kc-test
                  mountPath: /var/lib/pgrs
      volumes:
        - name: kc-test
          hostPath:
            path: /var/log