name: CI
on:
  push: 
    paths:
      - frontend/**

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: checkout sc
        uses: actions/checkout@v4
        
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependancy-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: run app
        run: npm run dev
