name: CI
on:
  push: 
    branches:
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: checkout sc
        uses: actions/checkout@v4
        
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        working-directory: frontend
        run: npm ci
        
      # - name: lint
      #   working-directory: frontend
      #   run: npm run lint
        
      - name: test
        working-directory: frontend
        run: npm run test
        
      - name: build
        working-directory: frontend
        run: npm run build
  
  test:
    runs-on: ubuntu-slim
    steps:
      - name: checkout sc
        uses: actions/checkout@v4
        
      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@v2.0.1
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: test
        working-directory: frontend
        run: npm run test
