name: CI
on:
  push: 
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: checkout sc
        uses: actions/checkout@v4
        
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
