name: CI backend
on:
  push:
    branches:
        - develop
    paths:
        - "backend/**"
  pull_request:
    branches:
        - main
        - develop
    paths:
        - "backend/**"

jobs:
  build_backend:
    runs-on: ubuntu-24.04
    steps:
        - uses: actions/checkout@v7

        - name: setup java 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
        - run: java --version

        - name: build and test
          run: mvn -B clean package --file backend/pom.xml