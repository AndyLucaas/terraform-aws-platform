name: CI backend
on:
  push:
    branches:
        - main
        - develop
    # paths:
    #     - "backend/**"
  pull_request:
    branches:
        - main
        - develop
    # paths:
    #     - "backend/**"
  workflow_dispatch:

jobs:
  build_backend:
    runs-on: ubuntu_alpine
    steps:
        - uses: actions/checkout@v7

        - name: setup java 25
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '25'
        - run: java --version
        
        - name: unit tests
          working-directory: backend
          run: mvn -B test --file pom.xml
