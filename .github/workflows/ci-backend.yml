name: CI backend
on:
  push:
    branches:
        - main
        - develop
    # paths:
    #     - "backend/**"
  pull_request:
    branches:
        - main
        - develop
    # paths:
    #     - "backend/**"

jobs:
  build_backend:
    runs-on: ubuntu-24.04
    steps:
        - uses: actions/checkout@v7

        - name: setup java 25
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '25'
        - run: java --version

        - name: build
          working-directory: backend
          run: |
            mvn -B clean
            mvn -B package --file pom.xml

        - name: unit tests
          working-directory: backend
          run: mvn -B test --file pom.xml

