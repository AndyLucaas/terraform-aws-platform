on:
  workflow_call:
    inputs:
      cluster_name:
        description: 'the name of the cluster'
        required: true
        type: string
      tag:
        description: 'tag'
        required: true
        type: string
      repo:
        description: 'to deploy'
        required: true
        type: string

jobs:
  helm-release:
    runs-on: ubuntu-24.04
    env:
        TODEPLOY: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: login to aws
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: config to use the cluster
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ inputs.cluster_name }}

      - name: deploy
        run: |
          helm upgrade --install itdesk . \
          -f values.yaml \
          -n production \
          --set-string "${{ inputs.repo }}.image.tag=${{ TAG }}"